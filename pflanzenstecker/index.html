<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pflanzenstecker Vorschau</title>
  <style>
    :root {
      --bg: #f4f2ee;
      --card: #ffffff;
      --text: #1d1d1b;
      --muted: #6b6a66;
      --line: #dedbd4;
      --accent: #3d6b35;
      --error: #a33a2a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 860px; margin: 0 auto; padding: 32px 16px 48px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    p.lead { margin: 0 0 24px; color: var(--muted); }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px;
    }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input[type="text"] {
      width: 100%;
      font: inherit;
      font-size: 1.125rem;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .row { display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: center; margin-top: 16px; }
    .swatches { display: flex; gap: 8px; }
    .swatch {
      font: inherit; color: var(--text); cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--card); border: 1px solid var(--line); border-radius: 999px;
      padding: 4px 14px 4px 4px;
    }
    .swatch .dot { width: 24px; height: 24px; border-radius: 50%; border: 1px solid #c9c4b8; }
    .swatch[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .seg button {
      font: inherit; border: 0; background: transparent; padding: 6px 12px; cursor: pointer; color: var(--text);
    }
    .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
    #stage {
      margin-top: 20px;
      /* Light, slightly darker than the white filament. */
      background: repeating-linear-gradient(0deg, transparent 0 9px, #dcd7cc 9px 10px),
                  repeating-linear-gradient(90deg, transparent 0 9px, #dcd7cc 9px 10px), #e4e0d7;
      border-radius: 8px;
      padding: 16px;
      display: flex; justify-content: center; align-items: center;
    }
    #preview { width: 100%; }
    #stage.vertical #preview { height: 520px; width: auto; aspect-ratio: auto; }
    #stage.horizontal #preview { height: auto; }
    .fonts-label { font-weight: 600; margin: 20px 0 8px; }
    .fonts {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 8px;
    }
    .font-option {
      font: inherit; text-align: left; cursor: pointer; color: var(--text);
      background: #fbfaf8; border: 1px solid var(--line); border-radius: 8px;
      padding: 8px 10px; display: flex; flex-direction: column; gap: 6px;
    }
    .font-option:hover { border-color: #b9b5ab; }
    .font-option[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .font-option .mini { height: 40px; overflow: hidden; }
    .font-option .name { font-size: 0.8125rem; color: var(--muted); }
    /* Enlarged lettering, only on narrow screens where the whole label gets small. */
    .detail { display: none; }
    @media (max-width: 600px) {
      .detail {
        display: block; margin-top: 8px; padding: 12px;
        background: repeating-linear-gradient(0deg, transparent 0 9px, #dcd7cc 9px 10px),
                    repeating-linear-gradient(90deg, transparent 0 9px, #dcd7cc 9px 10px), #e4e0d7;
        border-radius: 8px;
      }
      .detail-label { font-size: 0.8125rem; color: var(--muted); margin-bottom: 4px; }
    }
    .status { margin-top: 12px; min-height: 1.5em; color: var(--muted); }
    .status.error { color: var(--error); }
  </style>
</head>
<body>
  <main>
    <h1>Pflanzenstecker</h1>
    <p class="lead">Name eingeben – die Vorschau entspricht exakt der gedruckten Kontur.</p>

    <div class="card">
      <label for="name">Pflanzenname</label>
      <input id="name" type="text" value="Basilikum" maxlength="24" autocomplete="off" spellcheck="false">

      <div class="row">
        <div class="swatches" role="group" aria-label="Farbe">
        </div>
        <div class="seg" role="group" aria-label="Ausrichtung">
          <button data-orientation="horizontal" aria-pressed="true">Liegend</button>
          <button data-orientation="vertical" aria-pressed="false">Stehend</button>
        </div>
      </div>

      <div class="fonts-label" id="fonts-label">Schriftart</div>
      <div class="fonts" id="fonts" role="group" aria-labelledby="fonts-label"></div>

      <div id="stage" class="horizontal"><div id="preview"></div></div>
      <div class="detail" aria-hidden="true"><div class="detail-label">Schriftzug vergrößert</div><div id="detail"></div></div>
      <div id="status" class="status" aria-live="polite"></div>
    </div>
  </main>
